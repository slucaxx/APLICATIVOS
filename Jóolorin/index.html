html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#080605 repeating-linear-gradient(90deg,#0d0907 0 40px,#100b09 40px 80px);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif}
h1,h2,h3,.f{font-family:'Archivo Black',Impact,sans-serif;font-weight:400}
#app{max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 60px #000}
#main{flex:1;overflow-y:auto;overflow-x:hidden}
.p{padding:18px 16px 24px}
.kente{height:6px;flex:none;background:repeating-linear-gradient(90deg,var(--g) 0 12px,var(--y) 12px 24px,var(--r) 24px 36px,#111 36px 42px)}
[onclick]{cursor:pointer}
.btn{display:block;text-align:center;background:var(--y);color:#111;font-family:'Archivo Black',sans-serif;padding:15px;border-radius:99px;font-size:16px}
.btn:active,.gen:active,.alb:active{transform:scale(.97)}
.chip{display:inline-block;padding:7px 14px;border-radius:99px;background:var(--s2);font-size:12px;font-weight:600;margin:0 6px 6px 0}
.chip.on{background:var(--g);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
.sec h3{font-size:16px}.sec small{color:var(--y);font-size:11px;font-weight:700}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.cv{border-radius:10px;flex:none;position:relative;overflow:hidden}
.c1{background:linear-gradient(135deg,var(--r),var(--y))}
.c2{background:linear-gradient(135deg,var(--g),#0b3d1e)}
.c3{background:repeating-linear-gradient(45deg,var(--y) 0 8px,#111 8px 16px)}
.c4{background:radial-gradient(circle at 30% 30%,var(--y),var(--r) 60%,#3a0a0a)}
.c5{background:linear-gradient(160deg,#111,var(--g))}
.c6{background:repeating-linear-gradient(90deg,var(--r) 0 10px,var(--g) 10px 20px,var(--y) 20px 30px)}
.cv::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 80%,transparent 0 8px,rgba(0,0,0,.22) 9px 10px,transparent 11px);background-size:22px 22px}
.alb{width:128px;flex:none}.alb .cv{width:128px;height:128px}
.alb b{display:block;margin-top:7px;font-size:13px}.alb span,.mu{color:var(--mu);font-size:12px}
.av{width:78px;text-align:center;flex:none;font-size:12px;font-weight:600}
.av .cv{width:74px;height:74px;border-radius:50%;border:2px solid var(--y);margin-bottom:6px}
.search,#q{display:block;width:100%;background:var(--s2);border:0;border-radius:12px;padding:13px 14px;color:var(--tx);font:14px Inter,sans-serif;margin-top:14px;outline:0}
.search{color:var(--mu)}#q:focus{box-shadow:0 0 0 2px var(--y)}
.trk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--s2)}
.trk em{font-style:normal;color:var(--mu);width:16px;font-size:12px}
.trk b{display:block;font-size:14px}.trk .d{margin-left:auto;color:var(--mu);font-size:12px}
.trk.on b,.trk.on em{color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gen{border-radius:14px;padding:14px;height:96px;display:flex;align-items:flex-end;font-family:'Archivo Black',sans-serif;font-size:15px;color:#fff;text-shadow:0 1px 6px #000a;position:relative;overflow:hidden}
.gen span{position:relative;z-index:1}
.li{display:flex;gap:12px;align-items:center;padding:8px 0}
.li .cv{width:56px;height:56px}.li b{display:block;font-size:14px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--s2);margin:14px 0 6px;font-weight:700;font-size:14px}
.tabs span{color:var(--mu);padding-bottom:9px;border-bottom:3px solid transparent}
.tabs .on{color:var(--y);border-color:var(--y)}
.hero{height:250px;position:relative;display:flex;align-items:flex-start;padding:16px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,var(--bg))}
.back{position:relative;z-index:2;width:36px;height:36px;border-radius:50%;background:#000a;display:grid;place-items:center;font-size:20px}
.ico{display:flex;gap:14px;align-items:center;margin:14px 0 8px}
.ico svg{width:26px;height:26px;fill:none;stroke:var(--mu);stroke-width:2}
.ico svg.on{fill:var(--r);stroke:var(--r)}
.play{width:56px;height:56px;border-radius:50%;background:var(--g);display:grid;place-items:center;margin-left:auto;color:#fff;font-size:22px}
#mini{display:none;margin:0 10px 8px;background:var(--s2);border-radius:12px;padding:8px 10px;align-items:center;gap:10px;position:relative;overflow:hidden}
#mini .cv{width:40px;height:40px}#mini b{display:block;font-size:13px}
#mini .pp{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--y);color:#111;display:grid;place-items:center;font-size:14px}
#pb{position:absolute;left:0;bottom:0;height:3px;background:var(--g);width:0}
#nav{display:flex;justify-content:space-around;padding:10px 0 12px;background:var(--s1);border-top:1px solid var(--s2);flex:none}
#nav div{text-align:center;font-size:11px;color:var(--mu);font-weight:600;flex:1}
#nav svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
#nav .on{color:var(--y)}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;background:repeating-linear-gradient(135deg,rgba(214,40,40,.6) 0 30px,rgba(245,197,24,.55) 30px 60px,rgba(31,163,74,.6) 60px 90px,#000 90px 96px),#000}
.welcome::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,10,8,.3),var(--bg) 72%)}
.welcome>div{position:relative;padding:28px 24px 40px;text-align:center}
.dc{margin-top:18px;border-radius:22px;padding:16px 14px 16px;background:radial-gradient(circle at 50% 0,rgba(245,197,24,.22),transparent 60%),linear-gradient(180deg,var(--s1),var(--s2));border:1px solid #3a2a20;text-align:center}
.dc small{color:var(--y);font-weight:700;letter-spacing:.08em;font-size:11px}
.dc h3{font-size:21px;margin:2px 0 14px}
.stage{position:relative;width:min(100%,290px);aspect-ratio:300/480;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 0 0 3px var(--y),0 0 0 6px var(--g),0 0 0 9px var(--r),0 14px 40px #000;user-select:none}
.hs{position:absolute;z-index:3}
.bub{position:absolute;z-index:5;left:4%;top:4%;max-width:60%;background:var(--tx);color:#111;font-size:12px;font-weight:700;line-height:1.3;padding:8px 11px;border-radius:14px;text-align:left;pointer-events:none;transform-origin:20% 100%}
.pads{display:flex;gap:8px;justify-content:center;margin-top:16px}
.pd{flex:1;max-width:96px;padding:11px 0;border-radius:14px;font-weight:700;font-size:12px;color:#111}
.pd:active{transform:scale(.94)}
#dd{animation:bob 1.6s ease-in-out infinite alternate}
.jam #dd{animation-duration:.45s}
#foL{transform-origin:80px 266px;animation:fo .9s ease-in-out infinite alternate}
#foR{transform-origin:220px 266px;animation:fo2 .9s ease-in-out .45s infinite alternate}
#hd2{transform-origin:150px 198px;animation:tilt 2.4s ease-in-out infinite alternate}
#drm{transform-origin:150px 300px}
#fd{transform-origin:45px 440px;animation:kb 1.2s ease-in-out infinite alternate}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.mt{transform-box:fill-box;transform-origin:50% 0;animation:talk .7s ease-in-out infinite alternate}
@keyframes fo{to{transform:rotate(-16deg)}}
@keyframes fo2{to{transform:rotate(16deg)}}
@keyframes tilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes kb{to{transform:translateY(-6px)}}
@keyframes bob{to{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(.65)}}
@media (prefers-reduced-motion:reduce){#dd,#foL,#foR,#hd2,#fd,.eyes,.mt,.fc{animation:none!important}}
#fp{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:14px 22px 24px;overflow-y:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#fp.on{transform:none}
.fh{display:flex;align-items:center;justify-content:space-between;text-align:center}
.fh small{display:block;font-size:10px;letter-spacing:.1em;color:var(--mu);font-weight:700}.fh b{font-size:13px}
.fh>span{width:36px;height:36px;display:grid;place-items:center;font-size:24px;cursor:pointer}
.fc{width:100%;max-width:300px;aspect-ratio:1;margin:18px auto 22px;border-radius:14px;box-shadow:0 18px 40px #000a;flex:none}
.fc.pl{animation:cpl 1.2s ease-in-out infinite alternate}
@keyframes cpl{to{transform:scale(1.03)}}
.ft{display:flex;align-items:center;gap:12px}.ft h2{font-size:23px;line-height:1.1}
.ft svg{width:28px;height:28px;fill:none;stroke:var(--tx);stroke-width:2;flex:none;margin-left:auto;cursor:pointer}.ft svg.on{fill:var(--g);stroke:var(--g)}
.bar{height:22px;display:flex;align-items:center;touch-action:none;margin-top:16px;cursor:pointer}
.tk{position:relative;height:5px;border-radius:5px;background:#ffffff33;width:100%;pointer-events:none}
#fpb{display:block;height:100%;border-radius:5px;background:var(--tx);position:relative}
#fpb::after{content:"";position:absolute;right:-6px;top:-4px;width:13px;height:13px;border-radius:50%;background:var(--tx)}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:11px}
.cl{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;font-size:26px}
.cl span{width:44px;text-align:center;cursor:pointer;color:var(--tx)}
.cl .on{color:var(--g)}
.cl .big{width:68px;height:68px;border-radius:50%;background:var(--tx);color:#111;display:grid;place-items:center;font-size:26px}
.ac{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:14px;padding:12px;margin-top:22px}
.lg{display:block;margin:0 auto;filter:drop-shadow(0 0 30px rgba(255,140,0,.5))}#ts{position:absolute;left:16px;right:16px;bottom:96px;z-index:50;background:var(--r);color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;font-size:13px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}

.cvi{display:block;border-radius:10px;flex:none;object-fit:cover}
.mos{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;flex:none}
.mos img{width:100%;height:100%;display:block}
.hero2{position:relative;display:flex;justify-content:center;align-items:center;padding:64px 0 22px}
.hero2 .back{position:absolute;left:16px;top:16px;z-index:2}
.hero2>img,.hero2>.mos{box-shadow:0 14px 34px #000a}
.hero2>img[style*="50%"]{box-shadow:0 14px 34px #000a,0 0 0 2px var(--y)}
.ds{margin-top:22px;background:#00000040;border:1px solid #ffffff1f;border-radius:14px;padding:14px}
.ds small{color:var(--y);font-weight:700;letter-spacing:.08em;font-size:10px}
.ds p{margin:6px 0 10px;font-size:14px;line-height:1.55}
.ds .chip{margin-bottom:0}
#mini b,#mini span.mu{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk>div{flex:1}
.gen::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#000b)}.gen span{text-shadow:0 2px 8px #000,0 0 3px #000}
.mf{position:relative;text-align:left;margin:0 0 22px;padding:14px 16px;border-radius:14px;background:#0e0a08cc;border:1px solid #ffffff1f;border-left:4px solid var(--y)}.mf p{font-size:13px;line-height:1.6;color:var(--tx)}

const RT=[{"n":"Oke ode ilê","a":"Olodum Banda Reggae","ar":"Olodum","al":"Liberdade","d":"3:16","s":196,"r":0,"g":["Samba Reggae"],"col":"#6b4a00","ds":"Faixa do Olodum Banda Reggae, do álbum Liberdade. O título junta palavras de origem iorubá — ode (caçador) e ilê (casa) — e a música carrega a sonoridade afro-baiana que o Olodum levou do Pelourinho para o mundo."},{"n":"Yemanjá","a":"Majur","ar":"Majur","al":"Gira Mundo","d":"3:08","s":188,"r":1,"g":["Orixás","Afropop"],"col":"#0d3a66","ds":"Do álbum Gira Mundo, de Majur, um disco de 16 faixas em que cada música é dedicada a um orixá e quase tudo é cantado em iorubá. Yemanjá é a rainha do mar, celebrada todo 2 de fevereiro em Salvador."},{"n":"Ogum","a":"Majur","ar":"Majur","al":"Gira Mundo","d":"2:49","s":169,"r":2,"g":["Orixás","Afropop"],"col":"#6b1410","ds":"Dedicada a Ogum, orixá do ferro, da guerra e dos caminhos abertos. Majur contou que não colocaria uma música lenta para Ogum, por causa do caráter do orixá. Do álbum Gira Mundo."},{"n":"Olodum Mare","a":"Olodum","ar":"Olodum","al":"Olodum","d":"3:38","s":218,"r":3,"g":["Samba Reggae"],"col":"#8a4a10","ds":"Do Olodum, grupo cultural nascido em 1979 no Pelourinho, Centro Histórico de Salvador, que se tornou um dos maiores representantes da cultura baiana e afro-brasileira em todo o mundo."},{"n":"Oxum","a":"Majur","ar":"Majur","al":"Gira Mundo","d":"2:59","s":179,"r":4,"g":["Orixás","Afropop"],"col":"#7a5a05","ds":"Dedicada a Oxum, orixá das águas doces, do ouro, da beleza e do amor. Faz parte do álbum Gira Mundo, de Majur, que tem o afropop como base, com sons eletrônicos e atabaques."},{"n":"Vontade De Voar","a":"Urias","ar":"Urias","al":"CARRANCA","d":"4:14","s":254,"r":5,"g":["Pop"],"col":"#4a2a6a","ds":"Quinta faixa de CARRANCA, álbum de Urias que reflete sobre a identidade brasileira e usa imagens do candomblé. O título do disco vem da carranca, a figura de madeira esculpida colocada em barcos para afastar maus espíritos."},{"n":"Logun Edé","a":"Majur","ar":"Majur","al":"Gira Mundo","d":"3:31","s":211,"r":6,"g":["Orixás","Afropop"],"col":"#0f5a4a","ds":"Dedicada a Logun Edé, orixá filho de Oxóssi e Oxum, que une a mata e o rio. Faixa do álbum Gira Mundo, de Majur."},{"n":"Nanã","a":"Majur","ar":"Majur","al":"Gira Mundo","d":"3:37","s":217,"r":7,"g":["Orixás","Afropop"],"col":"#4a2468","ds":"Dedicada a Nanã, a mais velha das iabás, senhora da lama da qual, segundo a tradição iorubá, os humanos foram moldados, ligada à memória e à ancestralidade. Do álbum Gira Mundo, de Majur."},{"n":"Bará","a":"Majur","ar":"Majur","al":"Gira Mundo","d":"3:38","s":218,"r":8,"g":["Orixás","Afropop"],"col":"#4a0f0f","ds":"Abre o álbum Gira Mundo, de Majur. Bará é o mensageiro entre o mundo material e o espiritual, dono dos caminhos e das encruzilhadas."},{"n":"Eu Não Sou Santa","a":"Anitta, Mestrinho","ar":"Anitta","al":"EQUILIBRIVM II","d":"2:31","s":151,"r":9,"g":["Pop","Forró"],"col":"#16408f","ds":"Parceria de Anitta com o sanfoneiro Mestrinho. Segue a linha do forró e faz referência a Nossa Senhora Aparecida. Do álbum EQUILIBRIVM II, que fala de amor, espiritualidade e ancestralidade."},{"n":"Feitiço","a":"Anitta, Mart'nália","ar":"Anitta","al":"EQUILIBRIVM II","d":"2:54","s":174,"r":10,"g":["Pop"],"col":"#4a0f4a","ds":"Anitta com Mart'nália. A faixa samplea o ponto de Exu “Botaram Feitiço”, de J. B. de Carvalho. Do álbum EQUILIBRIVM II."},{"n":"Você Já Sabe","a":"Anitta, Los Brasileros","ar":"Anitta","al":"EQUILIBRIVM II","d":"2:45","s":165,"r":11,"g":["Pop","Funk"],"col":"#5a3a10","ds":"Abre o álbum EQUILIBRIVM II, de Anitta, com participação de Los Brasileros. Mistura tambores de candomblé com o tamborzão do funk."},{"n":"A Liberdade","a":"Urias, Marcinha do Corintho","ar":"Urias","al":"Urias","d":"1:38","s":98,"r":12,"g":["Pop"],"col":"#a04a6a","ds":"Urias com Marcinha do Corintho, voz que também narra interlúdios no álbum CARRANCA. É a faixa mais curta da coleção, com 1 minuto e 38 segundos."},{"n":"Tudo Isso","a":"Anitta","ar":"Anitta","al":"EQUILIBRIVM II","d":"3:35","s":215,"r":13,"g":["Pop","Reggae"],"col":"#6a1a3a","ds":"De Anitta, do álbum EQUILIBRIVM II. Segue a sonoridade do reggae, um dos ritmos que o disco mistura com funk e forró."},{"n":"Contemplação","a":"Anitta, Grupo Ofá","ar":"Anitta","al":"EQUILIBRIVM II","d":"3:27","s":207,"r":14,"g":["Pop"],"col":"#0b4a58","ds":"Anitta com o Grupo Ofá, ligado ao Terreiro do Gantois, em Salvador. Tem versos em iorubá e produção de Julio Feijuca. Do álbum EQUILIBRIVM II."}];
