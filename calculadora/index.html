<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="central">
    
        <h2>CALCULADORA DE COMPRA</h2>
        <div class="cal">
            <label for="preco">Preço do produto(R$):</label>
            <input type="text" id="preco" placeholder="Ex:100">
        </div>

        <div class="cal">
             <label for="quantidade">Quantidade:</label>
            <input type="text" id="quantidade" placeholder="Ex:2">
        </div>

        <div class="cal">
            <label for="desconto">Desconto(%):</label>
            <input type="text" id="desconto" placeholder="Ex:10">
        </div>

        <button id="botao">Calcular Valor Final</button>

        
        <div class="resultado">
            <span id="resultado1"></span>
        </div>

    </div>

    <script src="/js/script.js"></script>
    
</body>
</html>
